<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Literacy Assistance - Backend Database Portal</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0f172a;
      --surface: #1e293b;
      --surface-hover: #334155;
      --border: #334155;
      --primary: #58cc02;
      --secondary: #1cb0f6;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --danger: #ef4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      padding: 0;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.25rem 2rem;
      background: rgba(30, 41, 59, 0.9);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .logo { font-size: 1.35rem; font-weight: 800; color: var(--primary); display: flex; align-items: center; gap: 8px; }
    .nav-btns { display: flex; gap: 10px; }
    .btn {
      padding: 0.5rem 1rem;
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.85rem;
      border: none;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-secondary { background: var(--surface); color: var(--text); border: 1px solid var(--border); }
    .btn-secondary:hover { background: var(--surface-hover); }
    .btn-danger { background: var(--danger); color: #fff; }
    
    .container { max-width: 1300px; margin: 2rem auto; padding: 0 1.5rem; }
    .title-area { margin-bottom: 2rem; }
    .title { font-size: 2rem; font-weight: 800; margin-bottom: 0.25rem; }
    .subtitle { color: var(--text-muted); font-size: 1rem; }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
      gap: 1rem;
      margin-bottom: 2.5rem;
    }
    .stat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 1.25rem;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .stat-card:hover, .stat-card.active {
      border-color: var(--primary);
      background: var(--surface-hover);
      transform: translateY(-2px);
    }
    .stat-val { font-size: 2rem; font-weight: 800; color: var(--primary); }
    .stat-name { font-size: 1rem; font-weight: 700; margin-top: 4px; }
    .stat-desc { font-size: 0.75rem; color: var(--text-muted); margin-top: 4px; }

    .table-container {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 1.5rem;
    }
    .table-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
      flex-wrap: wrap;
      gap: 1rem;
    }
    .search-input {
      padding: 0.6rem 1rem;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      width: 260px;
    }
    table { width: 100%; border-collapse: collapse; text-align: left; font-size: 0.875rem; }
    th, td { padding: 0.875rem 1rem; border-bottom: 1px solid var(--border); }
    th { background: rgba(15, 23, 42, 0.5); color: var(--text-muted); font-size: 0.75rem; text-transform: uppercase; }
    tr:hover { background: var(--surface-hover); }

    /* Modal */
    .modal-overlay {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.7); display: none; justify-content: center; align-items: center; z-index: 100;
    }
    .modal { background: var(--surface); padding: 2rem; border-radius: 16px; border: 1px solid var(--border); width: 100%; max-width: 500px; }
    .form-group { margin-bottom: 1rem; }
    .form-group label { display: block; font-size: 0.85rem; font-weight: 700; margin-bottom: 0.4rem; }
    .form-group input, .form-group select, .form-group textarea {
      width: 100%; padding: 0.6rem; border-radius: 6px; border: 1px solid var(--border); background: var(--bg); color: var(--text);
    }
  </style>
</head>
<body>

  <header class="header">
    <div class="logo">⚡ Literacy Assistance - Backend Database Portal</div>
    <div class="nav-btns">
      <a href="/docs" target="_blank" class="btn btn-secondary">📖 OpenAPI Docs (/docs)</a>
      <a href="/redoc" target="_blank" class="btn btn-secondary">📘 ReDoc (/redoc)</a>
    </div>
  </header>

  <div class="container">
    <div class="title-area">
      <h1 class="title">Backend Database System (11 Core Entities)</h1>
      <p class="subtitle">Live backend dashboard for inspecting and managing all database tables and records.</p>
    </div>

    <!-- 11 Entity Cards Grid -->
    <div class="stats-grid" id="statsGrid"></div>

    <!-- Live Data Table -->
    <div class="table-container" id="tableContainer">
      <div class="table-header">
        <div>
          <h2 id="tableTitle" style="font-size: 1.4rem;">Select an Entity Table</h2>
          <p id="tableDesc" style="color: var(--text-muted); font-size: 0.85rem;"></p>
        </div>
        <div style="display: flex; gap: 10px;">
          <input type="text" id="searchInput" class="search-input" placeholder="Search table rows..." onkeyup="filterRows()" />
          <button class="btn btn-primary" onclick="openAddModal()">+ Add New Record</button>
        </div>
      </div>

      <div style="overflow-x: auto;">
        <table id="dataTable">
          <thead id="tableHead"></thead>
          <tbody id="tableBody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Add Record Modal -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal">
      <h3 style="margin-bottom: 1rem;" id="modalTitle">Add New Record</h3>
      <form id="addForm" onsubmit="submitRecord(event)">
        <div id="formFields"></div>
        <div style="display: flex; justify-content: flex-end; gap: 10px; margin-top: 1.5rem;">
          <button type="button" class="btn btn-secondary" onclick="closeModal()">Cancel</button>
          <button type="submit" class="btn btn-primary">Save Record</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    let overview = [];
    let currentEntity = null;
    let tableData = [];

    async function loadOverview() {
      const res = await fetch('/api/database/overview');
      const data = await res.json();
      overview = data.entities;
      renderCards();
      if (overview.length > 0 && !currentEntity) {
        loadEntity(overview[0].key);
      }
    }

    function renderCards() {
      const grid = document.getElementById('statsGrid');
      grid.innerHTML = overview.map(ent => `
        <div class="stat-card ${currentEntity === ent.key ? 'active' : ''}" onclick="loadEntity('${ent.key}')">
          <div class="stat-val">${ent.count}</div>
          <div class="stat-name">${ent.name}</div>
          <div class="stat-desc">${ent.description}</div>
        </div>
      `).join('');
    }

    async function loadEntity(key) {
      currentEntity = key;
      renderCards();
      const res = await fetch(`/api/database/entities/${key}`);
      const data = await res.json();
      tableData = data.data;

      document.getElementById('tableTitle').innerText = `Table: ${data.name} (${data.total_records} Records)`;
      document.getElementById('tableDesc').innerText = data.description;

      const thead = document.getElementById('tableHead');
      thead.innerHTML = `<tr>${data.columns.map(c => `<th>${c}</th>`).join('')}<th>Actions</th></tr>`;

      renderTableRows(tableData, data.columns);
    }

    function renderTableRows(rows, cols) {
      const entCfg = overview.find(e => e.key === currentEntity);
      const columns = cols || (entCfg ? entCfg.columns : []);
      const tbody = document.getElementById('tableBody');
      
      if (rows.length === 0) {
        tbody.innerHTML = `<tr><td colspan="${columns.length + 1}" style="text-align: center; color: var(--text-muted);">No records in this table.</td></tr>`;
        return;
      }

      tbody.innerHTML = rows.map(r => `
        <tr>
          ${columns.map(c => `<td style="font-family: ${c === 'id' || c.endsWith('_id') ? 'monospace' : 'inherit'}">${r[c] !== null ? r[c] : '<span style="color:var(--text-muted)">NULL</span>'}</td>`).join('')}
          <td>
            <button class="btn btn-danger" style="padding:0.25rem 0.6rem; font-size:0.75rem;" onclick="deleteRecord('${r.id}')">Delete</button>
          </td>
        </tr>
      `).join('');
    }

    function filterRows() {
      const q = document.getElementById('searchInput').value.toLowerCase();
      const filtered = tableData.filter(row => Object.values(row).some(v => v && String(v).toLowerCase().includes(q)));
      renderTableRows(filtered);
    }

    function openAddModal() {
      const ent = overview.find(e => e.key === currentEntity);
      if (!ent) return;
      document.getElementById('modalTitle').innerText = `Add ${ent.name}`;
      const formFields = document.getElementById('formFields');
      formFields.innerHTML = ent.columns.filter(c => c !== 'id' && c !== 'created_at' && c !== 'updated_at').map(col => `
        <div class="form-group">
          <label>${col.replace('_', ' ').toUpperCase()}</label>
          <input type="text" name="${col}" placeholder="Enter ${col}..." />
        </div>
      `).join('');
      document.getElementById('modalOverlay').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('modalOverlay').style.display = 'none';
    }

    async function submitRecord(e) {
      e.preventDefault();
      const formData = new FormData(e.target);
      const payload = {};
      formData.forEach((val, key) => { if(val) payload[key] = val; });

      const res = await fetch(`/api/database/entities/${currentEntity}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      if (res.ok) {
        closeModal();
        loadEntity(currentEntity);
        loadOverview();
      } else {
        alert('Error saving record');
      }
    }

    async function deleteRecord(id) {
      if (!confirm('Are you sure you want to delete this record?')) return;
      const res = await fetch(`/api/database/entities/${currentEntity}/${id}`, { method: 'DELETE' });
      if (res.ok) {
        loadEntity(currentEntity);
        loadOverview();
      } else {
        alert('Error deleting record');
      }
    }

    loadOverview();
  </script>
</body>
</html>
